workflowCode: ecommerce_order_summary
workflowName: 电商订单消费总结
domain: mixed
enabled: true
riskLevel: LOW
requireUserConfirm: false
intentKeywords:
  - 查订单
  - 消费总结
  - 买了什么
description: 查询客户订单，汇总消费金额、品类偏好，并发送飞书卡片。

steps:
  - stepNo: 1
    stepName: 查询客户订单
    executorType: MCP
    toolName: ecommerce.query_customer_orders
    inputTemplate:
      customerName: "{{customerName}}"
      months: "{{months|default:12}}"
    outputKey: orders
    onError: STOP

  - stepNo: 2
    stepName: 总结订单数据
    executorType: LLM_SUMMARY
    toolName: ""
    inputTemplate:
      orders: "{{orders}}"
      instruction: "总结订单数量、总消费、客单价、品类偏好、重点商品"
    outputKey: summary
    onError: STOP

  - stepNo: 3
    stepName: 发送飞书卡片
    executorType: FEISHU_REPLY
    toolName: feishu.send_card
    inputTemplate:
      title: "{{customerName}} · 订单总结"
      content: "{{summary}}"
    outputKey: replyResult
    onError: STOP
